name: publish

# Publishes to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing (OIDC): no API token is stored anywhere.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          version=$(python -c "import taskattest; print(taskattest.__version__)")
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: Test before publishing
        run: |
          python selftest.py
          python test_xlsx.py
          python test_trace.py
          python test_draft.py
          python test_examples.py
          python test_fixes.py
          python test_gate.py
          python test_mcp_server.py
      - name: Build
        run: |
          python -m pip install --quiet build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
