name: test

on:
  push:
  pull_request:

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Self-test
        run: python selftest.py
      - name: Excel reader
        run: python test_xlsx.py
      - name: MCP protocol
        run: python test_mcp_server.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --quiet build
          python -m build
      - name: Install into a clean venv and prove zero dependencies
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet --no-index dist/*.whl
          /tmp/clean/bin/pip list --format=freeze
          test "$(/tmp/clean/bin/pip list --format=freeze | grep -vE '^(pip|setuptools)==' | wc -l)" -eq 1
          python selftest.py > /dev/null
          cd /tmp && /tmp/clean/bin/taskattest --spec "$GITHUB_WORKSPACE/fixtures/case_ok/spec.json"
